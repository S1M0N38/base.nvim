name: Release LuaRocks

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  luarocks-release:
    runs-on: ubuntu-latest
    name: LuaRocks Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: LuaRocks Upload
        uses: nvim-neorocks/luarocks-tag-release@v7
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
